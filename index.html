<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5E5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prelims Daily">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Prelims Daily</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F3EC; --card:#FFFFFF; --ink:#1D2433; --muted:#6B7280; --line:#E7E1D6;
  --brand:#0F5E5C; --brand-ink:#FFFFFF; --brand-soft:#E3F0EE;
  --saffron:#D9731A; --ok:#1F7A4D; --ok-soft:#E3F4EA; --bad:#B4372B; --bad-soft:#FBE8E5;
  --shadow:0 1px 2px rgba(20,20,30,.05),0 6px 20px rgba(20,20,30,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12161C; --card:#1B2129; --ink:#E9ECF1; --muted:#9AA3AF; --line:#2A323C;
  --brand:#4FB3A9; --brand-ink:#0D1B1A; --brand-soft:#1D3533;
  --saffron:#F0A050; --ok:#5BC48A; --ok-soft:#173326; --bad:#F07A6E; --bad-soft:#3A1F1C;
  --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
h1,h2,.serif{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}
h1{font-size:28px;margin:2px 0 0;line-height:1.15}
h2{font-size:22px;margin:4px 0 12px}
button{font-family:inherit}
a{color:var(--brand)}
.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 16px;gap:12px}
.icon{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;width:44px;height:44px;font-size:18px;cursor:pointer;color:var(--ink);display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;min-width:0}
.stat b{display:block;font:700 20px/1.2 Fraunces,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}
.stat.fire b{color:var(--saffron)}
.note{font-size:14px;color:var(--muted);margin:8px 2px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.hint{font-size:13px;color:var(--muted);margin:10px 2px 0}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:500;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.primary{display:block;width:100%;border:0;border-radius:14px;padding:15px;background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:16px;cursor:pointer;margin-top:16px}
.primary:disabled{opacity:.45;cursor:default}
.ghost{display:block;width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--card);color:var(--ink);font-weight:500;font-size:15px;cursor:pointer;margin-top:8px;text-align:center;text-decoration:none}
.sub{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.dots{display:flex;gap:6px}
.dots button{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;cursor:pointer}
.dots button.cur{border-color:var(--brand)}
.dots button.ok{background:var(--ok);border-color:var(--ok)}
.dots button.bad{background:var(--bad);border-color:var(--bad)}
.dots button.skip{background:var(--muted);border-color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.rev{color:var(--saffron);border-color:var(--saffron)}
.stem{font-size:17px;font-weight:500;line-height:1.5;margin:0 0 10px}
ol.st{margin:0 0 10px;padding-left:22px}
ol.st li{margin:4px 0}
table.match{width:100%;border-collapse:collapse;font-size:15px;margin:4px 0 10px}
table.match th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.match td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.match td.n{width:28px;color:var(--muted)}
.tail{font-weight:500;margin:6px 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font-size:15px;cursor:pointer;line-height:1.4}
.opt .l{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.skipbtn{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;cursor:pointer;margin:10px auto 0;display:block}
.fb{margin-top:14px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.skip{background:var(--bg);color:var(--muted)}
details.why{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.why summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none}
details.why summary::-webkit-details-marker{display:none}
details.why summary::after{content:"＋";float:right;color:var(--muted)}
details.why[open] summary::after{content:"－"}
details.why p{margin:0 0 10px;font-size:15px}
.links{display:grid;gap:6px;margin:0 0 12px}
.links a{display:block;padding:9px 12px;border-radius:10px;background:var(--brand-soft);text-decoration:none;font-size:14px;font-weight:500}
.links a::after{content:" ↗"}
.flag{display:inline-block;margin-top:10px;font-size:13px;color:var(--muted)}
/* summary + progress */
.big{font:700 40px/1.1 Fraunces,Georgia,serif;margin:4px 0}
.rows{display:grid;gap:8px;margin-top:12px}
.row{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.row .r{flex:none;width:22px;text-align:center}
.row small{display:block;color:var(--muted);font-size:12px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.subj{margin:12px 0}
.subj .h{display:flex;justify-content:space-between;font-size:14px}
.subj .h span{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
input[type=time]{font:600 22px Inter,system-ui,sans-serif;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.danger{background:none;border:0;color:var(--bad);font-size:13px;margin:20px auto 0;display:block;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;max-width:min(92vw,480px);opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="questions.js"></script>
<script>
(function(){
"use strict";

/* ====== SETTINGS YOU CAN EDIT ====== */
const CONFIG = {
  appName: "Prelims Daily",
  perDay: 5,
  flagWhatsApp: "",   // e.g. "919876543210" (country code + number, no + or spaces). Leave "" to hide.
  flagEmail: "pvskarthik99@gmail.com"       // used only if flagWhatsApp is empty
};
/* =================================== */

const SUBJECTS = [
  ["ancient","Ancient & Medieval"],["modern","Modern History"],["culture","Art & Culture"],
  ["polity","Polity"],["economy","Economy"],["geography","Geography"],
  ["environment","Environment"],["science","Science & Tech"]
];
const SUBJ = Object.fromEntries(SUBJECTS);
const QS = Array.isArray(window.QUESTIONS) ? window.QUESTIONS : [];
const QBY = Object.fromEntries(QS.map(q => [q.id, q]));
const RANKS = [[0,"Aspirant"],[20,"Prelims Qualified"],[60,"Mains Warrior"],[120,"Interview Call"],[250,"Topper"]];
const LET = ["a","b","c","d","e"];

/* ---------- storage ---------- */
const KEY = "prelimsDaily.v1";
const DEF = {mode:"easy",subject:"random",xp:0,marks:0,streak:0,best:0,lastDay:null,freezeWeek:null,hist:{},days:{},log:[],remTime:"08:00"};
let memCopy = null;
function load(){ try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){} return memCopy; }
function save(){ memCopy = S; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = Object.assign({}, DEF, load() || {});

/* ---------- dates ---------- */
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ const p = s.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(s,n){ const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); }
function diffDays(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function today(){ return ymd(new Date()); }
function weekKey(s){ const d = parseD(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d); }

(function prune(){ const cut = addDays(today(), -21); Object.keys(S.days).forEach(k => { if(k < cut) delete S.days[k]; }); })();

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(n){ return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0$/,""); }
function hash(str){ let h = 1779033703 ^ str.length; for(let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; } return h>>>0; }
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function shuffle(arr, r){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
let toastTimer = null;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200); }

/* ---------- streak ---------- */
function liveStreak(){
  if(!S.lastDay) return {n:0, state:"none"};
  const gap = diffDays(S.lastDay, today());
  if(gap <= 0) return {n:S.streak, state:"done"};
  if(gap === 1) return {n:S.streak, state:"pending"};
  if(gap === 2 && S.freezeWeek !== weekKey(today())) return {n:S.streak, state:"freeze"};
  return {n:0, state:"lost"};
}
function touchStreak(){
  const t = today();
  if(S.lastDay === t) return null;
  const gap = S.lastDay ? diffDays(S.lastDay, t) : 99;
  let msg = null;
  if(gap === 1) S.streak += 1;
  else if(gap === 2 && S.freezeWeek !== weekKey(t)){ S.streak += 1; S.freezeWeek = weekKey(t); msg = "❄️ Streak freeze used — missed a day, streak survives. Day " + S.streak + "."; }
  else S.streak = 1;
  S.lastDay = t; S.best = Math.max(S.best, S.streak);
  return msg || (S.streak > 1 ? "🔥 Day " + S.streak + " — streak secured." : "🔥 Streak started.");
}

/* ---------- daily set ---------- */
function setKey(){ return S.mode + "|" + S.subject; }
function pool(mode, subject){ return QS.filter(q => q.mode === mode && (subject === "random" || q.subj === subject)); }
function getSet(){
  const t = today(); S.days[t] = S.days[t] || {};
  const k = setKey();
  if(S.days[t][k]) return S.days[t][k];
  const p = pool(S.mode, S.subject);
  const r = rng(hash(t + k));
  const isDue = q => S.hist[q.id] && S.hist[q.id].due && S.hist[q.id].due <= t;
  const due = p.filter(isDue).sort((a,b) => S.hist[a.id].due < S.hist[b.id].due ? -1 : 1).slice(0, 2);
  const unseen = shuffle(p.filter(q => !S.hist[q.id]), r);
  let picks = due.concat(unseen).slice(0, CONFIG.perDay);
  if(picks.length < CONFIG.perDay){
    const used = new Set(picks.map(q => q.id));
    const seen = p.filter(q => !used.has(q.id)).sort((a,b) => ((S.hist[a.id]||{}).last||"") < ((S.hist[b.id]||{}).last||"") ? -1 : 1);
    picks = picks.concat(seen).slice(0, CONFIG.perDay);
  }
  const dueIds = new Set(due.map(q => q.id));
  const set = {ids: picks.map(q => q.id), review: picks.filter(q => dueIds.has(q.id)).map(q => q.id), ans: {}};
  S.days[t][k] = set; save();
  return set;
}

/* ---------- answering ---------- */
function answer(qid, choice){
  const set = getSet();
  if(set.ans[qid]) return null;
  const q = QBY[qid]; const t = today();
  const skip = choice === -1;
  const ok = !skip && choice === q.ans;
  let pts = 0;
  if(q.mode === "easy"){ if(ok){ pts = 10; S.xp += 10; } }
  else { pts = ok ? 2 : (skip ? 0 : -0.66); S.marks = Math.round((S.marks + pts)*100)/100; }
  set.ans[qid] = {c:choice, ok:ok, skip:skip, pts:pts};
  const h = S.hist[qid] || {n:0, k:0, box:0};
  h.n++; if(ok) h.k++; h.last = t;
  if(ok){ if(h.box === 1){ h.box = 2; h.due = addDays(t,7); } else if(h.box === 2){ h.box = 3; h.due = null; } }
  else { h.box = 1; h.due = addDays(t,3); }
  S.hist[qid] = h;
  S.log.push({d:t, s:q.subj, m:q.mode, ok:ok, skip:skip});
  if(S.log.length > 3000) S.log = S.log.slice(-3000);
  const streakMsg = touchStreak();
  save();
  return {ok:ok, skip:skip, pts:pts, streakMsg:streakMsg};
}

/* ---------- rank ---------- */
function totalCorrect(){ return Object.values(S.hist).reduce((s,h) => s + (h.k||0), 0); }
function rankInfo(){
  const c = totalCorrect(); let cur = RANKS[0], next = RANKS[1] || null;
  RANKS.forEach((r,i) => { if(c >= r[0]){ cur = r; next = RANKS[i+1] || null; } });
  return {c:c, cur:cur, next:next};
}

/* ---------- views ---------- */
const $app = document.getElementById("app");
let view = "home", qi = 0;
function go(v){ view = v; render(); window.scrollTo(0,0); }
function render(){ ({home:renderHome, quiz:renderQuiz, summary:renderSummary, progress:renderProgress, remind:renderRemind})[view](); }

function renderHome(){
  const st = liveStreak(), r = rankInfo(), set = getSet();
  const done = Object.keys(set.ans).length, total = set.ids.length;
  let note = "";
  if(st.state === "none") note = "One question a day keeps the streak alive. All five if you're feeling sharp.";
  else if(st.state === "pending") note = "Answer one question today to keep your " + st.n + "-day streak.";
  else if(st.state === "freeze") note = "You missed yesterday. Today's first answer uses your weekly streak freeze ❄️";
  else if(st.state === "lost") note = "Fresh start today. Best streak so far: " + S.best + " days.";
  else note = done >= total && total ? "Today's set is done. See you tomorrow ✨" : "Streak secured for today 🔥";
  const scoreStat = S.mode === "easy" ? "<b>" + S.xp + "</b><span>XP</span>" : "<b>" + fmt(S.marks) + "</b><span>exam marks</span>";
  const btn = !total ? "No questions in this subject yet" : done === 0 ? "Start today's " + total : done < total ? "Continue · " + done + "/" + total + " done" : "Review today's answers";
  const desc = S.mode === "easy"
    ? "Single-answer MCQs. +10 XP for each correct answer."
    : "Prelims format: statements, match the pairs. +2 correct, −0.66 wrong, skip for 0.";
  $app.innerHTML =
    '<header class="top"><div><div class="eyebrow">' + esc(new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"})) + '</div><h1>' + esc(CONFIG.appName) + '</h1></div>' +
    '<button class="icon" data-act="progress" aria-label="Progress">📊</button></header>' +
    '<section class="stats">' +
      '<div class="stat fire"><b>🔥 ' + st.n + '</b><span>day streak</span></div>' +
      '<div class="stat"><b>' + esc(r.cur[1]) + '</b><span>rank</span></div>' +
      '<div class="stat">' + scoreStat + '</div>' +
    '</section>' +
    '<p class="note">' + esc(note) + '</p>' +
    '<section class="card">' +
      '<div class="seg" role="tablist">' +
        '<button class="' + (S.mode==="easy"?"on":"") + '" data-act="mode:easy">Easy</button>' +
        '<button class="' + (S.mode==="exam"?"on":"") + '" data-act="mode:exam">Exam Mode</button>' +
      '</div>' +
      '<p class="hint">' + esc(desc) + '</p>' +
      '<div class="label">Subject</div>' +
      '<div class="chips">' +
        '<button class="chip ' + (S.subject==="random"?"on":"") + '" data-act="subj:random">🎲 Random</button>' +
        SUBJECTS.map(s => '<button class="chip ' + (S.subject===s[0]?"on":"") + '" data-act="subj:' + s[0] + '">' + esc(s[1]) + '</button>').join("") +
      '</div>' +
      '<button class="primary" data-act="start"' + (total ? "" : " disabled") + '>' + esc(btn) + '</button>' +
      '<div class="sub">About 5 minutes · 1 question keeps your streak</div>' +
    '</section>' +
    '<button class="ghost" data-act="remind">⏰ Set a daily reminder</button>';
}

function qBody(q){
  let h = '<p class="stem">' + esc(q.stem) + '</p>';
  if(q.type === "statements" && q.items) h += '<ol class="st">' + q.items.map(s => '<li>' + esc(s) + '</li>').join("") + '</ol>';
  if(q.type === "match" && q.pairs){
    h += '<table class="match"><thead><tr><th></th><th>' + esc((q.heads||[])[0]||"") + '</th><th>' + esc((q.heads||[])[1]||"") + '</th></tr></thead><tbody>' +
      q.pairs.map((p,i) => '<tr><td class="n">' + (i+1) + '.</td><td>' + esc(p[0]) + '</td><td>' + esc(p[1]) + '</td></tr>').join("") + '</tbody></table>';
  }
  if(q.tail) h += '<p class="tail">' + esc(q.tail) + '</p>';
  return h;
}
function flagLink(q){
  const msg = CONFIG.appName + " — question " + q.id + " looks wrong: ";
  if(CONFIG.flagWhatsApp) return "https://wa.me/" + CONFIG.flagWhatsApp + "?text=" + encodeURIComponent(msg);
  if(CONFIG.flagEmail) return "mailto:" + CONFIG.flagEmail + "?subject=" + encodeURIComponent("Question " + q.id) + "&body=" + encodeURIComponent(msg);
  return null;
}

function renderQuiz(){
  const set = getSet(); const id = set.ids[qi]; const q = QBY[id];
  if(!q){ go("home"); return; }
  const a = set.ans[id];
  const dots = set.ids.map((x,i) => {
    const ax = set.ans[x]; let c = ax ? (ax.skip ? "skip" : ax.ok ? "ok" : "bad") : "";
    if(i === qi) c += " cur";
    return '<button class="' + c + '" data-act="dot:' + i + '" aria-label="Question ' + (i+1) + '"></button>';
  }).join("");
  let h = '<header class="qtop"><button class="icon" data-act="home" aria-label="Home">←</button><div class="dots">' + dots + '</div><span class="pill">' + (q.mode==="easy"?"Easy":"Exam") + '</span></header>';
  h += '<article class="card"><div class="meta"><span class="tag">' + esc(SUBJ[q.subj]||q.subj) + '</span>' +
       (set.review.indexOf(id) > -1 ? '<span class="tag rev">↻ Review</span>' : '') +
       (q.tag ? '<span class="tag">' + esc(q.tag) + '</span>' : '') + '</div>';
  h += qBody(q);
  h += '<div class="opts">' + q.opts.map((o,i) => {
    let c = "opt";
    if(a){ if(i === q.ans) c += " right"; else if(i === a.c) c += " wrong"; else c += " dim"; }
    return '<button class="' + c + '" data-act="opt:' + i + '"' + (a ? " disabled" : "") + '><span class="l">' + LET[i] + '</span><span>' + esc(o) + '</span></button>';
  }).join("") + '</div>';
  if(!a && q.mode === "exam") h += '<button class="skipbtn" data-act="skip">Skip this one (0 marks)</button>';
  if(a){
    let fb, cls;
    if(a.skip){ cls = "skip"; fb = "Skipped · 0 marks · Answer: (" + LET[q.ans] + ")"; }
    else if(a.ok){ cls = "ok"; fb = "Correct · " + (q.mode==="easy" ? "+10 XP" : "+2 marks"); }
    else { cls = "bad"; fb = "Not quite · " + (q.mode==="easy" ? "0 XP" : "−0.66 marks") + " · Answer: (" + LET[q.ans] + ")"; }
    h += '<div class="fb ' + cls + '">' + esc(fb) + '</div>';
    h += '<details class="why"' + (a.ok ? "" : " open") + '><summary>Why? Read the explanation</summary><p>' + esc(q.why) + '</p>' +
         (q.links && q.links.length ? '<div class="links">' + q.links.map(l => '<a href="' + esc(l.u) + '" target="_blank" rel="noopener">' + esc(l.t) + '</a>').join("") + '</div>' : '') +
         '</details>';
    const fl = flagLink(q);
    if(fl) h += '<a class="flag" href="' + esc(fl) + '" target="_blank" rel="noopener">⚑ Think this is wrong? Flag it</a>';
  }
  h += '</article>';
  if(a){
    const last = qi >= set.ids.length - 1;
    const remaining = set.ids.filter(x => !set.ans[x]).length;
    h += '<button class="primary" data-act="next">' + (last ? (remaining ? "Next unanswered →" : "See today's summary") : "Next question →") + '</button>';
    if(!last && Object.keys(set.ans).length === 1) h += '<button class="ghost" data-act="home">Stop here — streak is safe</button>';
  }
  $app.innerHTML = h;
}

function renderSummary(){
  const set = getSet();
  const vals = set.ids.map(id => set.ans[id]).filter(Boolean);
  const correct = vals.filter(v => v.ok).length;
  const exam = S.mode === "exam";
  const score = vals.reduce((s,v) => s + (v.pts||0), 0);
  const scoreTxt = exam ? fmt(Math.round(score*100)/100) + " marks" : score + " XP";
  const st = liveStreak();
  let h = '<header class="top"><div><div class="eyebrow">Today\'s set</div><h1>Done for today</h1></div><button class="icon" data-act="home" aria-label="Home">←</button></header>';
  h += '<section class="card"><div class="eyebrow">Score</div><div class="big">' + correct + '/' + set.ids.length + '</div>' +
       '<div class="hint" style="margin:0">' + esc(scoreTxt) + ' · 🔥 ' + st.n + '-day streak</div>' +
       '<div class="rows">' + set.ids.map((id,i) => {
          const q = QBY[id], v = set.ans[id];
          const r = !v ? "·" : v.skip ? "–" : v.ok ? "✅" : "❌";
          const s = q.stem.length > 80 ? q.stem.slice(0,78) + "…" : q.stem;
          return '<div class="row" data-act="dot:' + i + '" style="cursor:pointer"><span class="r">' + r + '</span><div>' + esc(s) + '<small>' + esc(SUBJ[q.subj]) + '</small></div></div>';
        }).join("") + '</div></section>';
  h += '<button class="primary" data-act="switch">Try ' + (exam ? "Easy" : "Exam Mode") + ' too</button>';
  h += '<button class="ghost" data-act="progress">📊 See progress</button>';
  h += '<p class="sub">Missed questions come back for review in 3 days, then 7.</p>';
  $app.innerHTML = h;
}

function renderProgress(){
  const r = rankInfo(); const t = today(); const from = addDays(t, -6);
  const week = S.log.filter(l => l.d >= from);
  const wk = week.length, wkOk = week.filter(l => l.ok).length;
  const per = {};
  S.log.forEach(l => { per[l.s] = per[l.s] || {n:0,k:0}; per[l.s].n++; if(l.ok) per[l.s].k++; });
  const wper = {};
  week.forEach(l => { wper[l.s] = wper[l.s] || {n:0,k:0}; wper[l.s].n++; if(l.ok) wper[l.s].k++; });
  const ranked = Object.keys(wper).filter(s => wper[s].n >= 2).sort((a,b) => wper[b].k/wper[b].n - wper[a].k/wper[a].n);
  const dueCount = Object.values(S.hist).filter(h => h.due && h.due <= addDays(t, 3)).length;
  const toNext = r.next ? (r.next[0] - r.c) : 0;
  const pct = r.next ? Math.round((r.c - r.cur[0]) / (r.next[0] - r.cur[0]) * 100) : 100;
  let h = '<header class="top"><div><div class="eyebrow">Progress</div><h1>' + esc(r.cur[1]) + '</h1></div><button class="icon" data-act="home" aria-label="Home">←</button></header>';
  h += '<section class="card"><div class="subj" style="margin:0"><div class="h"><b>' + r.c + ' correct answers</b><span>' + (r.next ? toNext + ' to ' + esc(r.next[1]) : 'Top rank reached') + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div></div></section>';
  h += '<section class="stats">' +
       '<div class="stat fire"><b>🔥 ' + liveStreak().n + '</b><span>streak</span></div>' +
       '<div class="stat"><b>' + S.best + '</b><span>best streak</span></div>' +
       '<div class="stat"><b>' + S.xp + '</b><span>XP · ' + fmt(S.marks) + ' marks</span></div></section>';
  h += '<section class="card"><div class="eyebrow">Last 7 days</div>' +
       (wk ? '<p style="margin:8px 0 0">' + wk + ' answered · ' + Math.round(wkOk/wk*100) + '% accuracy' +
          (ranked.length ? '<br>Strongest: <b>' + esc(SUBJ[ranked[0]]) + '</b>' + (ranked.length > 1 ? ' · Needs work: <b>' + esc(SUBJ[ranked[ranked.length-1]]) + '</b>' : '') : '') +
          (dueCount ? '<br>' + dueCount + ' question' + (dueCount>1?'s':'') + ' lined up for review' : '') + '</p>'
          : '<p class="hint">Nothing yet this week. Today is a good day to start.</p>') + '</section>';
  h += '<section class="card"><div class="eyebrow">Subject mastery</div>' + SUBJECTS.map(s => {
    const p = per[s[0]];
    if(!p) return '<div class="subj"><div class="h">' + esc(s[1]) + '<span>Not started</span></div><div class="bar"><i style="width:0"></i></div></div>';
    const acc = Math.round(p.k/p.n*100);
    return '<div class="subj"><div class="h">' + esc(s[1]) + '<span>' + p.k + '/' + p.n + ' · ' + acc + '%</span></div><div class="bar"><i style="width:' + acc + '%"></i></div></div>';
  }).join("") + '</section>';
  h += '<button class="danger" data-act="reset">Reset all progress</button>';
  $app.innerHTML = h;
}

function renderRemind(){
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const g = '<button class="primary" data-act="gcal">Add to Google Calendar</button>';
  const i = '<button class="' + (ios ? "primary" : "ghost") + '" data-act="ics">' + (ios ? "Add to iPhone Calendar" : "Download calendar file (.ics)") + '</button>';
  let h = '<header class="top"><div><div class="eyebrow">Reminder</div><h1>Daily nudge</h1></div><button class="icon" data-act="home" aria-label="Home">←</button></header>';
  h += '<section class="card"><p style="margin:0 0 12px">Adds a 5-minute daily event to your calendar with a link back here, so your phone reminds you every day.</p>' +
       '<div class="label" style="margin-top:0">Remind me at</div><input type="time" id="rt" value="' + esc(S.remTime) + '">' +
       (ios ? i + '<button class="ghost" data-act="gcal">Use Google Calendar instead</button>' : g + i) + '</section>';
  h += '<p class="sub">You can change or delete the event from your calendar any time.</p>';
  $app.innerHTML = h;
}

/* ---------- reminders ---------- */
function appUrl(){ return location.href.split("#")[0].split("?")[0]; }
function nextStart(){ const p = S.remTime.split(":").map(Number); const d = new Date(); d.setHours(p[0], p[1], 0, 0); if(d <= new Date()) d.setDate(d.getDate()+1); return d; }
function localStamp(d){ return ymd(d).replace(/-/g,"") + "T" + String(d.getHours()).padStart(2,"0") + String(d.getMinutes()).padStart(2,"0") + "00"; }
function utcStamp(d){ return d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); }
function openGcal(){
  const s = nextStart(), e = new Date(s.getTime() + 5*60000);
  let tz = "Asia/Kolkata"; try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; }catch(err){}
  const u = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(CONFIG.appName + " — today's 5") +
    "&details=" + encodeURIComponent("5 minutes. Open: " + appUrl()) +
    "&dates=" + localStamp(s) + "/" + localStamp(e) +
    "&ctz=" + encodeURIComponent(tz) +
    "&recur=" + encodeURIComponent("RRULE:FREQ=DAILY");
  window.open(u, "_blank");
}
function downloadIcs(){
  const s = nextStart(), url = appUrl();
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Prelims Daily//EN","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    "UID:prelims-daily-" + Date.now() + "@prelims-daily",
    "DTSTAMP:" + utcStamp(new Date()),
    "DTSTART:" + utcStamp(s),
    "DURATION:PT5M","RRULE:FREQ=DAILY",
    "SUMMARY:" + CONFIG.appName + " — today's 5",
    "DESCRIPTION:5 minutes. Open: " + url,
    "URL:" + url,
    "BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:" + CONFIG.appName,"END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
  const href = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = href; a.download = "prelims-daily-reminder.ics";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(href); a.remove(); }, 1500);
}

/* ---------- events ---------- */
function doAnswer(choice){
  const set = getSet(); const id = set.ids[qi];
  const res = answer(id, choice);
  if(!res) return;
  render();
  const n = Object.keys(set.ans).length;
  if(res.streakMsg) toast(res.streakMsg + (n === 1 && set.ids.length > 1 ? " " + (set.ids.length-1) + " bonus questions to go — or stop here." : ""));
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el || el.disabled) return;
  const parts = el.dataset.act.split(":"), act = parts[0], arg = parts[1];
  switch(act){
    case "home": go("home"); break;
    case "mode": S.mode = arg; save(); render(); break;
    case "subj": S.subject = arg; save(); render(); break;
    case "start": {
      const set = getSet(); if(!set.ids.length) return;
      const i = set.ids.findIndex(id => !set.ans[id]);
      if(i === -1) go("summary"); else { qi = i; go("quiz"); }
      break; }
    case "opt": doAnswer(+arg); break;
    case "skip": doAnswer(-1); break;
    case "next": {
      const set = getSet();
      if(qi < set.ids.length - 1){ qi++; go("quiz"); }
      else { const i = set.ids.findIndex(id => !set.ans[id]); if(i === -1) go("summary"); else { qi = i; go("quiz"); } }
      break; }
    case "dot": qi = +arg; go("quiz"); break;
    case "progress": go("progress"); break;
    case "remind": go("remind"); break;
    case "gcal": openGcal(); break;
    case "ics": downloadIcs(); break;
    case "switch": S.mode = S.mode === "easy" ? "exam" : "easy"; save(); go("home"); break;
    case "reset": if(confirm("Reset all progress? This can't be undone.")){ S = Object.assign({}, DEF, {hist:{},days:{},log:[]}); save(); go("home"); } break;
  }
});
document.addEventListener("change", e => { if(e.target && e.target.id === "rt" && e.target.value){ S.remTime = e.target.value; save(); } });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && view === "home") render(); });

render();
window.__PD = {get state(){ return S; }, answer: answer, getSet: getSet, today: today};
})();
</script>
